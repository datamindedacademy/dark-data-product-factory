version: 2

sources:
  - name: raw
    schema: raw
    description: >
      Raw tables landed by the ingestion team. Never query these from marts: go
      through the staging layer.
    tables:
      - name: orders
        description: Orders.
        columns:
          - name: order_id
          - name: customer_id
          - name: ordered_at
            description: Order timestamp in UTC.
          - name: channel
            description: web | app | store
          - name: store_id
            description: Only filled for channel = store.
          - name: status
            description: placed | shipped | delivered | cancelled
          - name: currency
          - name: shipping_fee
          - name: discount_code
          - name: _loaded_at
      - name: order_items
        description: Order lines.
      - name: products
        description: Product catalogue.
      - name: customers
        description: Customer accounts.
      - name: stores
        description: Physical stores.
      - name: returns
        description: Returns.
      - name: fx_rates
        description: FX rates.
      - name: web_sessions
        description: >
          Web + app sessions from the analytics tracker. customer_id is only known for
          logged-in sessions. converted_order_id is set when the session placed an order.
      - name: marketing_spend
        description: Daily paid marketing spend per channel, already in EUR.
