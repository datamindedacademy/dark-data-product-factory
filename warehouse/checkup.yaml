# checkup configuration for the Fernhill warehouse (https://pypi.org/project/checkup/).
#   dbt parse && checkup run                                  # whole project
#   checkup run --tag data_product=category_performance       # Fernhill rules for one product
#   checkup run -q --materializer markdown                    # plain table (what agents get)
providers:
  - name: dbt
    manifest_path: target/manifest.json

metrics:
  # project health from checkup-dbt
  - type: dbt_models
  - type: dbt_tests
  - type: dbt_column_test_coverage
  - type: dbt_models_without_description
  # Fernhill data product standards (factory/checkup_plugin.py) - mechanical rules only
  - type: fernhill_gov001_mart_naming
  - type: fernhill_gov002_model_description
  - type: fernhill_gov003_column_description
  - type: fernhill_gov004_grain
  - type: fernhill_gov005_ownership
  - type: fernhill_gov007_contract
  - type: fernhill_gov009_layering
