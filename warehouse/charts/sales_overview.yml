title: Sales overview
notes: Weekly business review board owned by analytics-engineering (data product `core`).

queries:
  headline:
    notes: Non-cancelled orders and net revenue for 2025.
    sql: |
      select count(*) as orders, sum(net_amount_eur) as net_revenue_eur
      from {{ ref('fct_orders') }}
      where not is_cancelled and order_date >= date '2025-01-01'
  monthly:
    notes: Net revenue per month and channel (cancelled orders excluded).
    sql: |
      select date_trunc('month', order_date) as month, channel, sum(net_amount_eur) as net_revenue_eur
      from {{ ref('fct_orders') }}
      where not is_cancelled
      group by 1, 2
      order by 1, 2

charts:
  orders_kpi:
    type: kpi
    query: headline
    label: Orders 2025
    value: orders
  revenue_kpi:
    type: kpi
    query: headline
    label: Net revenue 2025
    value: net_revenue_eur
  revenue_trend:
    type: line
    query: monthly
    title: Net revenue by channel
    x: month
    y: net_revenue_eur
    color: channel

rows:
  - cols: [orders_kpi, revenue_kpi]
  - revenue_trend
