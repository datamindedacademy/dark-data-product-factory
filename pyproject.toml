[project]
name = "dark-data-product-factory"
version = "0.1.0"
description = "Capstone: a dark factory for data products, built from Claude Agent SDK agents"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.178",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.9",
    "dbt-charts[mcp]>=0.11.1",
    "duckdb>=1.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "click>=8.1",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
