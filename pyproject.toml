[project]
name = "dark-data-product-factory"
version = "0.1.0"
description = "Capstone: a dark factory of Agno agents that answers business questions from data"
requires-python = ">=3.15"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pydantic>=2.7",
    "pyyaml>=6.0.4",  # first release with Python 3.15 wheels
    "click>=8.1",
    "rich>=13",
    "agno[mcp]>=3.0.5",
    "arize-phoenix-otel>=0.17.3",
    "openinference-instrumentation-agno>=1.2.2",
    "openai>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
factory = "factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
