description: >
  Reads a data product request (GitHub issue), investigates the warehouse and
  writes an executable spec: purpose, business questions, acceptance checks,
  output models, data quality notes.
model: default            # FACTORY_MODEL env var, else claude-opus-5-5
effort: medium
max_turns: 60
max_budget_usd: 3.0
system_prompt: system_prompt.md
system_prompt_mode: replace   # or "append" to keep Claude Code's own system prompt
prompt: prompt.md
builtin_tools: [Read, Write, Edit, Glob, Grep, Bash]
mcp:
  warehouse: [run_sql]        # also available: list_tables, describe_table
skills: []
outputs: [output/spec.yaml]
