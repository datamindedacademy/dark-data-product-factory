spec_version: 1
id: customer_nps
title: NPS per customer segment
status: infeasible
purpose: Report NPS per segment and relate it to purchase frequency.
requested_by: Elise Martin (Customer Experience)
infeasible_reason: >
  The warehouse has no survey or NPS data: no raw table contains survey responses or
  0-10 recommendation scores, so NPS cannot be computed. The segments (country,
  first-order channel) and purchase frequency are available once survey responses are
  landed with a customer_id.
open_questions:
  - Which tool collects the NPS survey and can its responses be ingested with customer_id?
inputs:
  - {name: dim_customers, columns: [customer_id, country_code]}
  - {name: fct_orders, columns: [customer_id, channel, is_cancelled]}
