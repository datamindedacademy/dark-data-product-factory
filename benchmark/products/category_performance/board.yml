title: Category performance
notes: Data product `category_performance` - monthly net revenue and returns per category for merchandising.

queries:
  kpis_2025:
    notes: "Answers Q1, Q2 - headline 2025 net revenue and unit return rate."
    sql: |
      select sum(net_revenue_eur) as net_revenue_eur,
             sum(units_returned) / sum(units_sold) as return_rate
      from {{ ref('fct_category_revenue_monthly') }}
      where year(month) = 2025
    formats:
      return_rate: percent
  monthly_by_category:
    notes: "Answers Q1 - net revenue per category per month."
    sql: |
      select month, category, net_revenue_eur
      from {{ ref('fct_category_revenue_monthly') }}
      order by month, category
  return_rate_2025:
    notes: "Answers Q2 - unit return rate per category in 2025."
    sql: |
      select category, sum(units_returned) / sum(units_sold) as return_rate
      from {{ ref('fct_category_revenue_monthly') }}
      where year(month) = 2025
      group by 1
      order by 2 desc
    formats:
      return_rate: percent
  mix_by_year:
    notes: "Answers Q3 - share of net revenue per category, 2024 vs 2025."
    sql: |
      select cast(year(month) as varchar) as year, category,
             sum(net_revenue_eur) / sum(sum(net_revenue_eur)) over (partition by year(month)) as share_of_net_revenue
      from {{ ref('fct_category_revenue_monthly') }}
      group by year(month), category
      order by 1, 2
    formats:
      share_of_net_revenue: percent

charts:
  net_revenue_kpi:
    type: kpi
    query: kpis_2025
    label: Net revenue 2025 (EUR)
    value: net_revenue_eur
  return_rate_kpi:
    type: kpi
    query: kpis_2025
    label: Unit return rate 2025
    value: return_rate
  net_revenue_trend:
    type: line
    query: monthly_by_category
    title: Net revenue per category per month (EUR)
    x: month
    y: net_revenue_eur
    color: category
  return_rate_by_category:
    type: bar
    query: return_rate_2025
    title: Return rate per category, 2025
    x: category
    y: return_rate
  category_mix:
    type: bar
    query: mix_by_year
    title: Category share of net revenue, 2024 vs 2025
    x: year
    y: share_of_net_revenue
    color: category

rows:
  - cols: [net_revenue_kpi, return_rate_kpi]
  - net_revenue_trend
  - cols: [return_rate_by_category, category_mix]
