spec_version: 1
id: store_performance
title: Store performance
status: needs_clarification
purpose: >
  Let retail operations compare stores fairly in the monthly store managers' call.
requested_by: Marc Dubois (Retail Operations Director)
inputs:
  - {name: fct_orders, columns: [order_id, store_id, channel, order_date, net_amount_eur, is_cancelled]}
  - {name: stg_stores, columns: [store_id, store_name, city, country_code, opened_at]}
data_quality_notes:
  - issue: There is no footfall / visitor counter data in the warehouse.
    handling: Visitor conversion cannot be computed until a footfall source is landed.
  - issue: Store floor area (square metres) is not available in stg_stores.
    handling: Sales per square metre needs a store size reference table from retail operations.
  - issue: London opened in June 2024 and sells in GBP.
    handling: Compare like-for-like months since opening; amounts converted to EUR.
open_questions:
  - Can retail operations provide footfall counts per store per day (which system)?
  - Can you provide the selling floor area in square metres per store?
  - Should store comparison be like-for-like (only months where all stores were open)?
assumptions: []
