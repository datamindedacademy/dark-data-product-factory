title: Customer retention
notes: Data product `customer_retention` - monthly acquisition cohorts and repeat purchases.

queries:
  new_customers:
    notes: "Answers Q1 - new customers per cohort month and first-order channel."
    sql: |
      select cohort_month, first_order_channel, cohort_customers
      from {{ ref('fct_customer_retention_monthly') }}
      where months_since_first_order = 0
      order by 1, 2
  triangle:
    notes: "Answers Q2 - cohort retention triangle (all channels)."
    sql: |
      select strftime(cohort_month, '%Y-%m') as cohort, months_since_first_order,
             sum(active_customers) / sum(cohort_customers) as retention_rate
      from {{ ref('fct_customer_retention_monthly') }}
      where months_since_first_order between 1 and 12
      group by 1, 2 order by 1, 2
    formats:
      retention_rate: percent
  curve_by_channel:
    notes: "Answers Q3 - customer-weighted retention curve per first-order channel."
    sql: |
      select first_order_channel, months_since_first_order,
             sum(active_customers) / sum(cohort_customers) as retention_rate
      from {{ ref('fct_customer_retention_monthly') }}
      where months_since_first_order between 1 and 12
      group by 1, 2 order by 1, 2
    formats:
      retention_rate: percent

charts:
  new_customers_bar:
    type: bar
    query: new_customers
    title: New customers per month
    x: cohort_month
    y: cohort_customers
    color: first_order_channel
  retention_heatmap:
    type: heatmap
    query: triangle
    title: Retention by cohort (months since first order)
    x: months_since_first_order
    y: cohort
    color: retention_rate
  retention_curve:
    type: line
    query: curve_by_channel
    title: Retention curve by first-order channel
    x: months_since_first_order
    y: retention_rate
    color: first_order_channel

rows:
  - new_customers_bar
  - cols: [retention_heatmap, retention_curve]
