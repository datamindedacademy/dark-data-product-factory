title: Marketing channel performance
notes: Data product `marketing_performance` - traffic, conversion and ROAS per channel.

queries:
  roas_kpis:
    notes: "Answers Q2 - 2025 ROAS for the two biggest paid channels."
    sql: |
      select
        sum(case when channel = 'paid_search' then net_revenue_eur end) / sum(case when channel = 'paid_search' then spend_eur end) as paid_search_roas,
        sum(case when channel = 'social' then net_revenue_eur end) / sum(case when channel = 'social' then spend_eur end) as social_roas
      from {{ ref('fct_marketing_channel_daily') }}
      where year(date) = 2025
  monthly:
    notes: "Answers Q1 - sessions and conversion rate per channel per month."
    sql: |
      select date_trunc('month', date) as month, channel, sum(sessions) as sessions,
             sum(orders) / sum(sessions) as conversion_rate
      from {{ ref('fct_marketing_channel_daily') }}
      group by 1, 2 order by 1, 2
    formats:
      conversion_rate: percent
  roas_by_year:
    notes: "Answers Q2 - ROAS per paid channel, 2024 vs 2025."
    sql: |
      select cast(year(date) as varchar) as year, channel, sum(net_revenue_eur) / sum(spend_eur) as roas
      from {{ ref('fct_marketing_channel_daily') }}
      where is_paid_channel
      group by 1, 2 order by 1, 2
  cpo_monthly:
    notes: "Answers Q3 - cost per order per paid channel per month."
    sql: |
      select date_trunc('month', date) as month, channel, sum(spend_eur) as spend_eur,
             sum(orders) as orders, sum(spend_eur) / nullif(sum(orders), 0) as cost_per_order_eur
      from {{ ref('fct_marketing_channel_daily') }}
      where is_paid_channel
      group by 1, 2 order by 1 desc, 2

charts:
  paid_search_roas:
    type: kpi
    query: roas_kpis
    label: Paid search ROAS 2025
    value: paid_search_roas
  social_roas:
    type: kpi
    query: roas_kpis
    label: Social ROAS 2025
    value: social_roas
  conversion_trend:
    type: line
    query: monthly
    title: Conversion rate per channel
    x: month
    y: conversion_rate
    color: channel
  sessions_trend:
    type: bar
    query: monthly
    title: Sessions per channel
    x: month
    y: sessions
    color: channel
  roas_comparison:
    type: bar
    query: roas_by_year
    title: ROAS per paid channel, 2024 vs 2025
    x: channel
    y: roas
    color: year
  cpo_table:
    type: table
    query: cpo_monthly
    title: Cost per order per paid channel

rows:
  - cols: [paid_search_roas, social_roas]
  - cols: [conversion_trend, sessions_trend]
  - cols: [roas_comparison, cpo_table]
