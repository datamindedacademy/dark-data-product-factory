version: 2

models:
  - name: fct_category_revenue_monthly
    description: >
      One row per calendar month (of the order date, UTC) and product category with
      units sold, units returned, sales, refunds and net revenue in EUR. Cancelled
      orders and internal QA accounts are excluded; refunds are attributed to the
      month in which the item was returned.
    config:
      contract: {enforced: true}
      meta:
        owner: analytics-engineering
        data_product: category_performance
        grain: [month, category]
    columns:
      - name: month
        data_type: date
        description: First day of the order month (UTC).
        data_tests: [not_null]
      - name: category
        data_type: varchar
        description: Normalised product category.
        data_tests: [not_null]
      - name: orders
        data_type: bigint
        description: Distinct non-cancelled orders containing at least one item of the category.
      - name: units_sold
        data_type: hugeint
        description: Units sold on non-cancelled orders.
      - name: units_returned
        data_type: hugeint
        description: Units returned (attributed to the order month).
      - name: sales_eur
        data_type: double
        description: Item revenue after discounts, before returns, in EUR, including shipping fees.
      - name: refunds_eur
        data_type: double
        description: Refunds for returned units in EUR (converted at the order FX rate).
      - name: net_revenue_eur
        data_type: double
        description: sales_eur minus refunds_eur.
      - name: return_rate
        data_type: double
        description: units_returned / units_sold, as a fraction.
