version: 2

models:
  - name: fct_customer_retention_monthly
    description: >
      One row per acquisition cohort month, first-order channel and number of months
      since the first order, with cohort size and the customers who placed at least one
      non-cancelled order in that month. Months without activity are present with
      zero active customers.
    config:
      contract: {enforced: true}
      meta:
        owner: analytics-engineering
        data_product: customer_retention
        grain: [cohort_month, first_order_channel, months_since_first_order]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [cohort_month, first_order_channel, months_since_first_order]
    columns:
      - name: cohort_month
        data_type: date
        description: Month (UTC) of the customer's first non-cancelled order.
        data_tests: [not_null]
      - name: first_order_channel
        data_type: varchar
        description: "Channel of the first order: web, app or store."
        data_tests: [not_null]
      - name: months_since_first_order
        data_type: integer
        description: Calendar months between the cohort month and the activity month (0 = cohort month).
        data_tests: [not_null]
      - name: cohort_customers
        data_type: bigint
        description: Customers in the cohort.
      - name: active_customers
        data_type: bigint
        description: Cohort customers with at least one non-cancelled order in the activity month.
      - name: retention
        data_type: double
        description: active_customers / cohort_customers, as a fraction.
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}

  - name: dim_retention_customers
    description: >
      One row per customer with their acquisition cohort and first-order channel, so
      CRM can export the customers of a cohort for the loyalty programme pilot.
    config:
      contract: {enforced: true}
      meta:
        owner: analytics-engineering
        data_product: customer_retention
        grain: [customer_id]
    columns:
      - {name: customer_id, data_type: varchar, description: Customer identifier., data_tests: [unique, not_null]}
      - {name: first_name, data_type: varchar, description: First name of the customer.}
      - {name: email, data_type: varchar, description: E-mail address to invite the customer to the pilot.}
      - {name: cohort_month, data_type: date, description: Month of the first non-cancelled order.}
      - {name: first_order_channel, data_type: varchar, description: Channel of the first order.}
