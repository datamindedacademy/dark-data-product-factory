version: 2

models:
  - name: fct_marketing_channel_daily
    description: >
      One row per day (session date, UTC) and traffic channel with sessions,
      converted orders (non-cancelled), attributed net revenue and paid spend in EUR.
      Internal QA accounts are excluded. ROAS and cost per order are derived as
      ratios of sums at the reporting grain (do not average daily ratios).
    config:
      meta:
        data_product: marketing_performance
        grain: [date, channel]
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [date, channel]
    columns:
      - name: date
        data_type: date
        description: Session date (UTC).
        data_tests: [not_null]
      - name: channel
        data_type: varchar
        description: "Traffic source: organic, paid_search, social, email or referral."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [organic, paid_search, social, email, referral]
      - name: sessions
        data_type: bigint
      - name: orders
        data_type: bigint
        description: Sessions that placed a non-cancelled order.
      - name: conversion_rate
        data_type: double
        description: orders / sessions, as a fraction.
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}
      - name: net_revenue_eur
        data_type: double
        description: Net amount (after discounts, before returns) of the converted orders, in EUR.
      - name: spend_eur
        data_type: double
        description: Paid marketing spend for the channel and day, in EUR (0 for unpaid channels).
      - name: is_paid_channel
        data_type: boolean
