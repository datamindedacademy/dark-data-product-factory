# The final: run one team's factory on a request and score its answers against the hidden right answers.
#
# This workflow lives in the organisers' repository and is the only thing that produces a score.
# From the team's commit only `agents/` (run job) and `benchmark/cases/` (grade job, data files only)
# are overlaid; everything else is this repository's code.
#
#   run    has the API key, runs team code       ─▶ artifact `submission` (answers.json, run summaries)
#   grade  has the right answers, no team code   ─▶ score.json, score.md
#
# Design, runbook and the loopholes that remain: docs/competition.md
name: "competition · final challenge"
run-name: "final challenge · ${{ inputs.team }} · ${{ inputs.oracle }}"

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Team name (A-Z, 0-9, _). Also selects the secret LLM_API_KEY_<TEAM>."
        required: true
      repo:
        description: "The team's repository (owner/name)"
        required: true
      sha:
        description: "Commit to run: the full SHA recorded at the freeze"
        required: true
      oracle:
        description: "Request id: a folder in benchmark/products (practice) or in the private oracle repository (final)"
        required: true
        default: category_performance
      issue:
        description: "Issue number of the request. Empty = practice: the public request's issue.md."
      pr:
        description: "Pull request to post the score on (optional)"

permissions: {}

env:
  TEAM: ${{ inputs.team }}
  REPO: ${{ inputs.repo }}
  SHA: ${{ inputs.sha }}
  ORACLE: ${{ inputs.oracle }}
  ISSUE: ${{ inputs.issue }}
  PR: ${{ inputs.pr }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate inputs
        run: |
          [[ "$TEAM" =~ ^[A-Z0-9_]+$ ]] && [[ "$REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] && \
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] && [[ "$ORACLE" =~ ^[a-z][a-z0-9_]*$ ]] && [[ "$ISSUE$PR" =~ ^[0-9]*$ ]]
      - uses: ./.github/actions/factory-setup
      - name: The request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$ISSUE" ]; then
            gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json title,body --jq '"# \(.title)\n\n\(.body)\n"' > "$RUNNER_TEMP/issue.md"
          else
            cp "benchmark/products/$ORACLE/issue.md" "$RUNNER_TEMP/issue.md"
          fi
      - name: Overlay the team's agents
        run: |
          git fetch --quiet --no-tags --depth 1 "https://github.com/$REPO.git" "$SHA"
          rm -rf agents
          git checkout --quiet FETCH_HEAD -- agents
      # Team code runs from here on. Nothing this job produces is trusted by the grade job.
      - name: Run the team's factory
        timeout-minutes: 45
        env:
          LLM_API_KEY: ${{ secrets[format('LLM_API_KEY_{0}', inputs.team)] || secrets.LLM_API_KEY }}
        run: factory line --issue "$RUNNER_TEMP/issue.md"   # stations and rework: the team's agents/line.yaml
      - name: Export the submission
        if: always()
        run: factory ci export-submission submission
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: submission-${{ inputs.team }}
          path: submission/
          if-no-files-found: ignore

  grade:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      # The team's new cases are data: only YAML, JSON, Markdown and CSV files are kept.
      - name: Validate the team's new benchmark cases
        run: |
          git fetch --quiet --no-tags --depth 1 "https://github.com/$REPO.git" "$SHA"
          rm -rf benchmark/cases
          git checkout --quiet FETCH_HEAD -- benchmark/cases
          find benchmark/cases -type f ! \( -name '*.yaml' -o -name '*.yml' -o -name '*.md' -o -name '*.json' -o -name '*.csv' \) -delete
          find benchmark/cases -type l -delete
          git diff --cached --name-only --diff-filter=A HEAD -- benchmark/cases \
            | { grep -E '^benchmark/cases/[a-z_]+/[^/]+\.yaml$' || true; } | head -6 \
            | xargs -r factory ci check-cases --out cases.json
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: submission-${{ inputs.team }}
          path: submission/
      - name: Fetch the hidden answers
        if: hashFiles(format('benchmark/products/{0}/answers.json', inputs.oracle)) == ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ORACLE_REPO }}
          token: ${{ secrets.ORACLE_TOKEN }}
          path: oracle
          persist-credentials: false
      - name: Score
        env:
          GH_TOKEN: ${{ github.token }}
          # The team's final-only key: its total spend is the cost of this run. This job runs no team code.
          LLM_API_KEY: ${{ secrets[format('LLM_API_KEY_{0}', inputs.team)] }}
        run: |
          mkdir -p submission
          right="benchmark/products/$ORACLE/answers.json"; [ -f "$right" ] || right="oracle/products/$ORACLE/answers.json"
          # Wall-clock time of the run job as GitHub measured it: the team cannot influence this number.
          duration=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "run") | (.completed_at | fromdate) - (.started_at | fromdate)')
          # Cost as OpenRouter measured it on that key; the run summaries' own figure is only a fallback.
          cost=""; [ -n "$LLM_API_KEY" ] && cost=$(factory ci key-usage) || true
          factory ci score submission --answers "$right" --cases cases.json --duration-s "$duration" ${cost:+--cost-usd "$cost"} --team "$TEAM"
          cat factory-out/score.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR" ]; then gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file factory-out/score.md; fi
      - uses: actions/upload-artifact@v4
        with:
          name: score-${{ inputs.team }}
          path: factory-out/score.json
