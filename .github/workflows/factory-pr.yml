# The back half of the dark factory, on every push to a data product PR:
#
#   checks (deterministic: dbt build, acceptance, checkup, dct validate) ─┐
#   review agent      ─▶ PR review                                       ├─▶ decide
#   governance agent  ─▶ PR comment                                      ┘
#
#   decide: all green          ─▶ label factory:approved, auto-merge (if vars.FACTORY_AUTO_MERGE == 'true')
#           findings, rounds left ─▶ implement agent reworks with the findings, pushes ─▶ this workflow again
#           findings, no rounds   ─▶ label needs-human
#
# Runs for PRs with a spec under warehouse/specs/ - also ones opened by humans.
name: "factory · pull request"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["warehouse/**"]

concurrency:
  group: factory-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false   # a rework push queues the next round instead of killing this one

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  PR: ${{ github.event.pull_request.number }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  GH_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
  # Swap a station for another agent directory with repository variables, e.g. FACTORY_AGENT_BI=agents/bi-teamx
  FACTORY_AGENT_INTAKE: ${{ vars.FACTORY_AGENT_INTAKE }}
  FACTORY_AGENT_IMPLEMENT: ${{ vars.FACTORY_AGENT_IMPLEMENT }}
  FACTORY_AGENT_REVIEW: ${{ vars.FACTORY_AGENT_REVIEW }}
  FACTORY_AGENT_GOVERNANCE: ${{ vars.FACTORY_AGENT_GOVERNANCE }}
  FACTORY_AGENT_BI: ${{ vars.FACTORY_AGENT_BI }}
  FACTORY_MODEL: ${{ vars.FACTORY_MODEL }}
  MAX_REWORK: ${{ vars.FACTORY_MAX_REWORK || '2' }}
  HEAD_REF: ${{ github.head_ref }}
  BASE_REF: ${{ github.base_ref }}

jobs:
  context:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      product_id: ${{ steps.find.outputs.product_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Which data product does this PR change?
        id: find
        run: |
          base="origin/$BASE_REF"
          spec=$(git diff --name-only "$base"...HEAD -- 'warehouse/specs/*.yaml' | head -1)
          if [ -z "$spec" ]; then
            dir=$(git diff --name-only "$base"...HEAD -- 'warehouse/models/marts/*' | grep -v '/core/' | head -1 | cut -d/ -f4)
            [ -n "$dir" ] && [ -f "warehouse/specs/$dir.yaml" ] && spec="warehouse/specs/$dir.yaml"
          fi
          if [ -z "$spec" ]; then echo "No data product spec touched - nothing for the factory to do."; exit 0; fi
          echo "product_id=$(basename "$spec" .yaml)" >> "$GITHUB_OUTPUT"

  checks:
    needs: context
    if: needs.context.outputs.product_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT: ${{ needs.context.outputs.product_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/factory-setup
      - name: Deterministic gates
        run: factory ci checks --spec "warehouse/specs/$PRODUCT.yaml"
      - name: Report
        if: always()
        run: |
          cat factory-out/checks.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body-file factory-out/checks.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-out-checks-${{ github.run_id }}
          path: factory-out/

  review:
    needs: context
    if: needs.context.outputs.product_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT: ${{ needs.context.outputs.product_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/factory-setup
      - name: Review agent
        id: review
        run: |
          gh pr view "$PR" --json title,body --jq '"# \(.title)\n\n\(.body)"' > pr.md
          factory ci review --spec "warehouse/specs/$PRODUCT.yaml" --base "origin/$BASE_REF" --pr-body pr.md
      - name: Post the review
        if: always() && steps.review.outputs.verdict != ''
        run: |
          cat factory-out/review.md >> "$GITHUB_STEP_SUMMARY"
          case "${{ steps.review.outputs.verdict }}" in
            approve)
              # Approving needs "Allow GitHub Actions to create and approve pull requests" (or an App token).
              gh pr review "$PR" --approve --body-file factory-out/review.md || gh pr comment "$PR" --body-file factory-out/review.md ;;
            request_changes)
              gh pr review "$PR" --request-changes --body-file factory-out/review.md || gh pr comment "$PR" --body-file factory-out/review.md ;;
            *) gh pr comment "$PR" --body-file factory-out/review.md ;;
          esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-out-review-${{ github.run_id }}
          path: factory-out/
      - name: Collect traces
        if: always()
        run: factory ci collect-runs traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-traces-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: traces/
          if-no-files-found: ignore

  governance:
    needs: context
    if: needs.context.outputs.product_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCT: ${{ needs.context.outputs.product_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/factory-setup
      - name: Governance agent
        id: gov
        run: factory ci governance --product "$PRODUCT"
      - name: Report
        if: always() && steps.gov.outputs.compliant != ''
        run: |
          cat factory-out/governance.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --body-file factory-out/governance.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-out-governance-${{ github.run_id }}
          path: factory-out/
      - name: Collect traces
        if: always()
        run: factory ci collect-runs traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-traces-governance-${{ github.run_id }}-${{ github.run_attempt }}
          path: traces/
          if-no-files-found: ignore

  decide:
    needs: [context, checks, review, governance]
    if: always() && needs.context.outputs.product_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PRODUCT: ${{ needs.context.outputs.product_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.FACTORY_TOKEN || github.token }}
      - uses: ./.github/actions/factory-setup
      - uses: actions/download-artifact@v4
        with:
          pattern: factory-out-*-${{ github.run_id }}
          path: factory-out/
          merge-multiple: true
      - name: Collect findings
        id: findings
        run: |
          factory ci feedback
          # Every gate must have reported. A crashed agent is never "no findings".
          complete=true
          for f in checks.json review.json governance.json; do
            [ -f "factory-out/$f" ] || { echo "missing factory-out/$f"; complete=false; }
          done
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          rounds=$(git log "origin/$BASE_REF"..HEAD --oneline --grep '^factory: rework' | wc -l)
          echo "rounds=$rounds" >> "$GITHUB_OUTPUT"
      - name: Pipeline incomplete - hand over to a human
        if: steps.findings.outputs.complete != 'true'
        run: |
          gh label create needs-human --color D93F0B 2>/dev/null || true
          gh pr edit "$PR" --add-label needs-human
          gh pr comment "$PR" --body "⚠️ Not every factory gate reported (checks: ${{ needs.checks.result }}, review: ${{ needs.review.result }}, governance: ${{ needs.governance.result }}). See the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
      - name: All green - approve and merge
        if: steps.findings.outputs.complete == 'true' && steps.findings.outputs.has_findings == 'false'
        run: |
          gh label create factory:approved --color 0E8A16 2>/dev/null || true
          gh pr edit "$PR" --add-label factory:approved --remove-label needs-human || true
          if [ "${{ vars.FACTORY_AUTO_MERGE }}" = "true" ]; then
            gh pr merge "$PR" --auto --squash
          else
            gh pr comment "$PR" --body "✅ All factory gates are green. Set the repository variable FACTORY_AUTO_MERGE=true to let the factory merge on its own."
          fi
      - name: Rework
        if: steps.findings.outputs.complete == 'true' && steps.findings.outputs.has_findings == 'true' && fromJSON(steps.findings.outputs.rounds) < fromJSON(env.MAX_REWORK)
        run: |
          round=$(( ${{ steps.findings.outputs.rounds }} + 1 ))
          gh pr comment "$PR" --body "🔁 Rework round $round/$MAX_REWORK: sending ${{ steps.findings.outputs.findings }} findings back to the implementation agent."
          factory ci implement --spec "warehouse/specs/$PRODUCT.yaml" --feedback factory-out/feedback.md
          git add "warehouse/models/marts/$PRODUCT"
          git commit --allow-empty -m "factory: rework round $round for $PRODUCT"
          git push origin "HEAD:$HEAD_REF"
      - name: Out of rework rounds - hand over to a human
        if: steps.findings.outputs.complete == 'true' && steps.findings.outputs.has_findings == 'true' && fromJSON(steps.findings.outputs.rounds) >= fromJSON(env.MAX_REWORK)
        run: |
          gh label create needs-human --color D93F0B 2>/dev/null || true
          gh pr edit "$PR" --add-label needs-human
          { echo "🙋 The factory gave up after $MAX_REWORK rework rounds. Open findings:"; echo; cat factory-out/feedback.md; } > msg.md
          gh pr comment "$PR" --body-file msg.md
      - name: Collect traces
        if: always()
        run: factory ci collect-runs traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-traces-decide-${{ github.run_id }}-${{ github.run_attempt }}
          path: traces/
          if-no-files-found: ignore
