# The line manager: every Monday, read the traces of last week's factory runs and
# open an issue with recommendations to make the line cheaper, faster and more reliable.
name: "factory · line manager"

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      days:
        description: Look back this many days
        default: "7"

permissions:
  contents: read
  actions: read
  issues: write

env:
  DAYS: ${{ inputs.days || '7' }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
  GH_TOKEN: ${{ github.token }}

jobs:
  line-manager:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/factory-setup
      - name: Download last week's traces
        run: |
          since=$(date -u -d "$DAYS days ago" +%Y-%m-%d)
          mkdir -p runs-in
          for wf in factory-build.yml factory-pr.yml factory-bench.yml; do
            gh run list --workflow "$wf" --created ">=$since" --limit 100 --json databaseId --jq '.[].databaseId' |
            while read -r id; do
              gh run download "$id" --pattern 'factory-traces-*' --dir "runs-in/$id" 2>/dev/null || true
            done
          done
          echo "runs: $(find runs-in -name summary.json | wc -l)"
      - name: Line manager agent
        run: |
          if [ "$(find runs-in -name summary.json | wc -l)" -eq 0 ]; then echo "No runs to analyse"; exit 0; fi
          factory ci line-manager --runs runs-in
          gh label create factory:line-manager --color 1D76DB 2>/dev/null || true
          gh issue create --title "Factory line report $(date -u +%Y-%m-%d)" \
            --label factory:line-manager --body-file factory-out/line_manager.md
