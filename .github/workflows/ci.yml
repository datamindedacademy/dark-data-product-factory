# CI for the factory itself (no LLM calls, no API key needed): the tests, which also check that
# every benchmark case is valid (doing nothing scores 0, the right answer scores 1).
name: "ci · factory"

on:
  push:
    branches: [main]
  pull_request:
    paths: ["factory/**", "benchmark/**", "agents/**", "tests/**", "data/**", "pyproject.toml", "uv.lock"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/factory-setup
      - run: pytest -q
