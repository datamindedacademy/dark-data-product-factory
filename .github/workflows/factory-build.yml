# The factory on GitHub: label an issue `data-request` and the line answers it.
#
#   label `data-request` ─▶ factory line ─▶ answers posted on the issue, label `factory:answered`
#                                            (or `needs-human` when the checkers still had findings)
#                         ─▶ intake not ready: its questions posted, label `needs-clarification`;
#                            the requester's reply runs the line again with the whole thread.
#
# Only a reply from the issue's author or a collaborator starts a run: each run costs money.
name: "factory · build"

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to answer
        required: true

concurrency:
  group: factory-issue-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  GH_TOKEN: ${{ github.token }}

jobs:
  line:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'data-request') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(github.event.issue.labels.*.name, 'needs-clarification') &&
       (github.event.comment.user.login == github.event.issue.user.login ||
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/factory-setup
      - name: Fetch the issue thread
        run: |
          gh issue view "$ISSUE" --json number,title,author,body,comments --jq '
            "# \(.title)\n\nRequested by \(.author.login)\n\n\(.body)\n" +
            ([.comments[] | select(.author.login != "github-actions") | "\n## Comment by \(.author.login)\n\n\(.body)\n"] | join(""))' > issue.md
          cat issue.md
      - name: Run the line
        timeout-minutes: 45
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: factory line --issue issue.md
      - name: Report on the issue
        if: always()
        run: |
          outcome=$(factory ci report)
          gh issue comment "$ISSUE" --body-file factory-out/comment.md
          cat factory-out/comment.md >> "$GITHUB_STEP_SUMMARY"
          case "$outcome" in
            stopped_*) label=needs-clarification ;;
            answered)  label=factory:answered ;;
            *)         label=needs-human ;;
          esac
          gh label create "$label" 2>/dev/null || true
          gh issue edit "$ISSUE" --remove-label needs-clarification --remove-label needs-human --add-label "$label" || \
            gh issue edit "$ISSUE" --add-label "$label"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: line-run-${{ github.run_id }}
          path: |
            runs/*/line_summary.json
            runs/*/*/summary.json
            runs/*/*/trace.jsonl
            runs/*/workspace/output/
          if-no-files-found: ignore
