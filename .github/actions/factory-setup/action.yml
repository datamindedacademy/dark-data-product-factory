name: Factory setup
description: Python 3.15 + uv and the project dependencies.
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v6
      with:
        python-version: "3.15"
        enable-cache: true
    - name: Install dependencies
      shell: bash
      run: |
        uv sync --extra dev --frozen
        echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
